<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Option 1: Fluid Wide-Screen Bento Grid</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col font-sans">
    <!-- Header -->
    <header class="bg-white border-b border-slate-200 h-16 flex items-center px-8 shadow-sm">
        <h1 class="font-bold text-lg text-slate-900">WorkplacePulse <span class="text-xs font-normal text-slate-500">Option 1: Bento Grid</span></h1>
    </header>

    <!-- Main Content -->
    <main class="max-w-[1800px] mx-auto w-full p-8 space-y-6">
        <!-- TIER 1: KPI Cards -->
        <div class="grid grid-cols-4 gap-6">
            <div class="bg-white rounded-xl p-5 border border-slate-200 shadow-sm"><p class="text-sm text-slate-500">SaaS Waste</p><h2 class="text-2xl font-bold">$12,450</h2></div>
            <div class="bg-white rounded-xl p-5 border border-slate-200 shadow-sm"><p class="text-sm text-slate-500">Dormant Seats</p><h2 class="text-2xl font-bold">143</h2></div>
            <div class="bg-white rounded-xl p-5 border border-slate-200 shadow-sm"><p class="text-sm text-slate-500">Fleet Health</p><h2 class="text-2xl font-bold text-emerald-600">92%</h2></div>
            <div class="bg-white rounded-xl p-5 border border-slate-200 shadow-sm"><p class="text-sm text-slate-500">Active Incidents</p><h2 class="text-2xl font-bold text-amber-600">3</h2></div>
        </div>

        <!-- TIER 2: 8/4 Split (Chart & AI) -->
        <div class="grid grid-cols-12 gap-6">
            <!-- Left: Chart -->
            <div class="col-span-8 bg-white rounded-xl p-6 border border-slate-200 shadow-sm min-h-[400px] flex items-center justify-center">
                <p class="text-slate-400 font-medium">[ Dynamic Telemetry Chart Area - 66% width ]</p>
            </div>
            <!-- Right: AI Copilot -->
            <div class="col-span-4 bg-indigo-50/50 rounded-xl p-6 border border-indigo-100 shadow-sm min-h-[400px] flex flex-col">
                <h3 class="font-semibold text-indigo-900 mb-4 flex items-center">✨ Gemini Copilot</h3>
                <div class="flex-1 border-t border-indigo-100 py-4 text-sm text-indigo-800">
                    <div class="bg-white p-3 rounded-lg border border-indigo-100 shadow-sm mb-3">Analyzing telemetry... I've detected a cluster of dormant Figma licenses.</div>
                </div>
                <input type="text" placeholder="Ask Gemini..." class="w-full text-sm border-indigo-200 rounded-lg p-2.5">
            </div>
        </div>

        <!-- TIER 3: Full Width Table -->
        <div class="bg-white rounded-xl p-6 border border-slate-200 shadow-sm min-h-[300px]">
            <h3 class="font-semibold text-slate-800 mb-4">Detailed Telemetry Matrix (Full Width)</h3>
            <div class="w-full bg-slate-100 h-8 rounded mb-2"></div>
            <div class="w-full bg-slate-50 h-8 rounded mb-2"></div>
            <div class="w-full bg-slate-100 h-8 rounded mb-2"></div>
        </div>
    </main>
</body>
</html>
