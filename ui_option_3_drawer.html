<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Option 3: Drawer Workspace</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 h-screen overflow-hidden flex font-sans">
    
    <!-- Main Workspace (Full Width) -->
    <div class="flex-1 flex flex-col h-full overflow-y-auto">
        <header class="bg-white border-b border-slate-200 h-16 flex items-center justify-between px-8 shadow-sm shrink-0">
            <h1 class="font-bold text-lg text-slate-900">WorkplacePulse <span class="text-xs font-normal text-slate-500">Option 3: Slide-Over Drawer</span></h1>
            <button class="bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm font-semibold flex items-center space-x-2 shadow-sm">
                <span>✨ Open AI Inspector</span>
                <kbd class="bg-indigo-700 px-2 py-0.5 rounded text-xs">⌘ J</kbd>
            </button>
        </header>

        <main class="p-8 space-y-6">
            <!-- Chart stretches completely -->
            <div class="bg-white rounded-xl p-6 border border-slate-200 shadow-sm h-[500px] flex items-center justify-center">
                <p class="text-slate-400 font-medium">[ 100% Full Width Telemetry Dashboard ]</p>
            </div>
            
            <div class="bg-white rounded-xl p-6 border border-slate-200 shadow-sm h-[500px]">
                <h3 class="font-semibold text-slate-800 mb-4">Unconstrained Data Table</h3>
            </div>
        </main>
    </div>

    <!-- AI Drawer (Fixed 460px on right) -->
    <aside class="w-[460px] bg-white border-l border-slate-200 shadow-2xl h-full flex flex-col z-50 transform transition-transform translate-x-0">
        <div class="h-16 border-b border-slate-200 flex items-center justify-between px-6 bg-slate-50/50">
            <h2 class="font-semibold text-slate-900">✨ Gemini Inspector</h2>
            <button class="text-slate-400 hover:text-slate-600">✕</button>
        </div>
        <div class="flex-1 p-6 overflow-y-auto bg-slate-50/30">
            <div class="bg-indigo-50 border border-indigo-100 p-4 rounded-xl text-sm text-indigo-900 mb-4 shadow-sm">
                Select any anomaly on the main dashboard, and I will analyze it here in the drawer.
            </div>
            <div class="space-y-4">
                <div class="bg-white p-4 border border-slate-200 rounded-xl shadow-sm text-sm">
                    <strong>User:</strong> Why is CPU spiking?
                </div>
                <div class="bg-white p-4 border border-slate-200 rounded-xl shadow-sm text-sm">
                    <strong>Gemini:</strong> Checking logs...
                </div>
            </div>
        </div>
        <div class="p-4 border-t border-slate-200 bg-white">
            <input type="text" placeholder="Type a command..." class="w-full bg-slate-100 border-transparent rounded-lg p-3 text-sm focus:ring-2 focus:ring-indigo-500">
        </div>
    </aside>

</body>
</html>
